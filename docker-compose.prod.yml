services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - prod_kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    restart: unless-stopped
    command: start --import-realm --http-enabled=true --http-relative-path=/auth --proxy=edge --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./backend/keycloak:/opt/keycloak/data/import:ro
      - ./backend/themes/fantasta:/opt/keycloak/themes/fantasta:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command: >
      sh -c 'java
      -Dquarkus.oidc.auth-server-url="$$OIDC_AUTH_SERVER_URL"
      -Dquarkus.oidc.token.issuer="$$OIDC_TOKEN_ISSUER"
      -Dquarkus.oidc.credentials.client-secret.value="$$KEYCLOAK_BACKEND_SECRET"
      -Dquarkus.oidc.credentials.client-secret.method=post
      -jar quarkus-run.jar'
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_PIN: ${ADMIN_PIN}
      APP_CREDITS_TOTAL: ${APP_CREDITS_TOTAL}
      APP_RANDOM_MODE: ${APP_RANDOM_MODE}
      APP_ROSTER_PORTIERI: ${APP_ROSTER_PORTIERI}
      APP_ROSTER_DIFENSORI: ${APP_ROSTER_DIFENSORI}
      APP_ROSTER_CENTROCAMPISTI: ${APP_ROSTER_CENTROCAMPISTI}
      APP_ROSTER_ATTACCANTI: ${APP_ROSTER_ATTACCANTI}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_BACKEND_SECRET: ${KEYCLOAK_BACKEND_SECRET}
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/auth/realms/fantasta
      QUARKUS_OIDC_TOKEN_ISSUER: ${OIDC_TOKEN_ISSUER}
      QUARKUS_OIDC_CREDENTIALS_CLIENT_SECRET_VALUE: ${KEYCLOAK_BACKEND_SECRET}
      QUARKUS_OIDC_CREDENTIALS_CLIENT_SECRET_METHOD: post
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/auth/realms/fantasta
      OIDC_TOKEN_ISSUER: ${OIDC_TOKEN_ISSUER}
      KEYCLOAK_ADMIN_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_REALM: fantasta
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  prod_pgdata:
  prod_kcdata:
