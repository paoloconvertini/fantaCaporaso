<div class="upload-container">
    <mat-card class="list-card">
        <h3>Importa quotazioni FantaMaster</h3>

        <div class="upload-section">
            <input type="file" (change)="onFileSelected($event)" />

            <button
                    mat-raised-button
                    color="primary"
                    (click)="uploadFile()"
                    [disabled]="!selectedFile || loading"
            >
                Verifica file
            </button>

            <mat-progress-spinner
                    *ngIf="loading"
                    diameter="32"
                    mode="indeterminate"
                    color="accent"
                    style="margin-left:12px; vertical-align:middle;"
            >
            </mat-progress-spinner>
        </div>

        <div *ngIf="uploadResult" class="upload-result">
            <h4>{{ uploadResult.preview ? 'Anteprima import:' : 'Risultato import:' }}</h4>
            <pre>{{ uploadResult | json }}</pre>
            <button
                    *ngIf="uploadResult.preview"
                    mat-raised-button
                    color="warn"
                    (click)="confirmImport()"
                    [disabled]="loading"
            >
                Conferma sostituzione completa
            </button>
        </div>
    </mat-card>
</div>
