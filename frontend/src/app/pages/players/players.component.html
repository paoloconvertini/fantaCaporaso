<div class="players-container">
    <mat-card class="list-card">
        <h3>Svincolati: <b>{{ players.length }}</b></h3>
    </mat-card>

    <div class="filter-bar">
        <button
                type="button"
                class="role-chip"
                [class.active]="selectedRole === null"
                (click)="setRole(null)"
        >
            Tutti
        </button>
        <button
                type="button"
                class="role-chip"
                *ngFor="let r of roles"
                [class.active]="selectedRole === r"
                (click)="setRole(r)"
        >
            {{ roleLabel(r) }}
        </button>
    </div>

    <mat-card class="list-card">
        <div *ngIf="loading" class="loading">Caricamento...</div>

        <table *ngIf="!loading && players.length" class="players-table">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Squadra</th>
                <th>Ruolo</th>
                <th>Valore</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let row of players">
                <td>{{ row.name }}</td>
                <td>{{ row.team }}</td>
                <td>{{ row.role }}</td>
                <td>{{ row.valore }}</td>
            </tr>
            </tbody>
        </table>

        <div *ngIf="!loading && !players.length" class="muted text-center">
            Nessun giocatore libero
        </div>

        <div *ngIf="!loading && players.length" class="players-list">
            <div *ngFor="let row of players" class="player-row">
                <div class="player-main">
                    <strong>{{ row.name }}</strong>
                    <span>{{ row.team }}</span>
                </div>
                <div class="player-meta">
                    <span class="role-pill">{{ roleLabel(row.role) }}</span>
                    <strong>{{ row.valore }}</strong>
                </div>
            </div>
        </div>
    </mat-card>
</div>
