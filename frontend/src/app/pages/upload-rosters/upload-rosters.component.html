<div class="upload-container">
    <mat-card class="list-card">
        <h3>Importa rose FantaMaster</h3>
        <p>Legge tutti i fogli e crea automaticamente le squadre mancanti.</p>

        <div class="upload-section">
            <input type="file" (change)="onFileSelected($event)" />

            <button
                    mat-raised-button
                    color="primary"
                    (click)="uploadFile()"
                    [disabled]="!selectedFile || loading"
            >
                Verifica file
            </button>

            <mat-progress-spinner
                    *ngIf="loading"
                    diameter="32"
                    mode="indeterminate"
                    color="accent"
                    style="margin-left:12px; vertical-align:middle;"
            >
            </mat-progress-spinner>
        </div>

        <div *ngIf="uploadResult" class="upload-result">
            <h4>Risultato import:</h4>
            <pre>{{ uploadResult | json }}</pre>
            <button *ngIf="uploadResult.preview" mat-raised-button color="warn" (click)="confirmImport()" [disabled]="loading">
                Conferma importazione
            </button>
        </div>
    </mat-card>
</div>
