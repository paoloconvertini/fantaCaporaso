server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store" always;

    location = /styles.css { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    location /api/ { return 503; }
    location /ws/ { return 503; }
    error_page 503 /auction-closed.html;
    location / { try_files /auction-closed.html =503; }
}
