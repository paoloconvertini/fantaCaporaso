# ========= COMUNE =========
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors=true
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.origins=${CORS_ORIGINS:*}

# Config custom app
admin.pin=${ADMIN_PIN:1234}
app.credits.total=${APP_CREDITS_TOTAL:500}
app.random.mode=${APP_RANDOM_MODE:ROLE}
app.roster.portieri=${APP_ROSTER_PORTIERI:3}
app.roster.difensori=${APP_ROSTER_DIFENSORI:8}
app.roster.centrocampisti=${APP_ROSTER_CENTROCAMPISTI:8}
app.roster.attaccanti=${APP_ROSTER_ATTACCANTI:6}

# ========= DATASOURCE =========
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fantasta}${POSTGRES_JDBC_PARAMS:}
quarkus.datasource.username=${POSTGRES_USER:fantasta}
quarkus.datasource.password=${POSTGRES_PASSWORD:devpass}

# Pool (ridotto se usi Neon free tier)
quarkus.datasource.jdbc.max-size=10

# ========= ORM =========
# Allineiamo dev e prod ? sempre update
quarkus.hibernate-orm.database.generation=update

# ========= DEV override =========
%dev.quarkus.http.cors.origins=${CORS_ORIGINS:*}

# ? OIDC Keycloak
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER:${OIDC_AUTH_SERVER_URL}}
%dev.quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER:any}
quarkus.oidc.client-id=fantasta-backend
quarkus.oidc.credentials.client-secret.value=${KEYCLOAK_BACKEND_SECRET}
quarkus.oidc.credentials.client-secret.method=post
quarkus.oidc.tls.verification=none

# Keycloak Admin API
app.keycloak.admin.url=${KEYCLOAK_ADMIN_URL:}
app.keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:fantasta}
app.keycloak.admin.user=${KEYCLOAK_ADMIN_USER:}
app.keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:}

# ? Permetti accesso ai WebSocket senza passare da OIDC
quarkus.http.auth.permission.websocket.paths=/ws/*
quarkus.http.auth.permission.websocket.policy=permit

# Angular dev-server websocket. In sviluppo deve restare sul FE; se arriva qui non deve inizializzare OIDC.
quarkus.http.auth.permission.angular-dev-ws.paths=/ng-cli-ws
quarkus.http.auth.permission.angular-dev-ws.policy=permit

# ? Protezione default
quarkus.http.auth.permission.public.paths=/public/*
quarkus.http.auth.permission.public.policy=permit

quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
