# ========= COMUNE =========
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.http.cors.origins=${CORS_ORIGINS:*}

# Config custom app
admin.pin=${ADMIN_PIN:1234}
app.credits.total=${APP_CREDITS_TOTAL:500}
app.random.mode=${APP_RANDOM_MODE:ROLE}
app.roster.portieri=${APP_ROSTER_PORTIERI:3}
app.roster.difensori=${APP_ROSTER_DIFENSORI:8}
app.roster.centrocampisti=${APP_ROSTER_CENTROCAMPISTI:8}
app.roster.attaccanti=${APP_ROSTER_ATTACCANTI:6}
app.environment=${APP_ENVIRONMENT:dev}
app.auction-archive.output-dir=${AUCTION_ARCHIVE_OUTPUT_DIR:target/auction-archive}
app.auction-archive.landing-dir=${AUCTION_ARCHIVE_LANDING_DIR:../landing-page}
app.auction-archive.publish-enabled=${AUCTION_ARCHIVE_PUBLISH_ENABLED:false}
%prod.app.auction-archive.cloudflare-account-id=${CLOUDFLARE_ACCOUNT_ID}
%prod.app.auction-archive.cloudflare-api-token=${CLOUDFLARE_PAGES_API_TOKEN}
app.auction-archive.cloudflare-project=${CLOUDFLARE_PAGES_PROJECT:fantacaporaso}

# Gazzetta: progetto Pages separato e mai abilitato implicitamente.
app.newspaper.publish-enabled=${NEWSPAPER_PUBLISH_ENABLED:false}
%prod.app.newspaper.cloudflare-account-id=${CLOUDFLARE_ACCOUNT_ID}
%prod.app.newspaper.cloudflare-api-token=${CLOUDFLARE_PAGES_API_TOKEN}
app.newspaper.cloudflare-project=${CLOUDFLARE_GAZZETTA_PROJECT:}

# ========= DATASOURCE =========
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fantasta}${POSTGRES_JDBC_PARAMS:}
quarkus.datasource.username=${POSTGRES_USER:fantasta}
quarkus.datasource.password=${POSTGRES_PASSWORD:devpass}

# Pool JDBC contenuto per lo stack a singola istanza
quarkus.datasource.jdbc.max-size=10

# ========= ORM =========
# Allineiamo dev e prod ? sempre update
quarkus.hibernate-orm.schema-management.strategy=update

# ========= DEV override =========
%dev.quarkus.http.cors.origins=${CORS_ORIGINS:*}

# Internal authentication
app.jwt.secret=${JWT_SECRET:dev-secret-change-me}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Permetti accesso ai WebSocket senza autenticazione HTTP
quarkus.http.auth.permission.websocket.paths=/ws/*
quarkus.http.auth.permission.websocket.policy=permit

# Angular dev-server websocket. In sviluppo deve restare sul FE; se arriva qui resta pubblico.
quarkus.http.auth.permission.angular-dev-ws.paths=/ng-cli-ws
quarkus.http.auth.permission.angular-dev-ws.policy=permit

# Public endpoints
quarkus.http.auth.permission.auth.paths=/api/auth/login,/api/auth/logout,/public/*
quarkus.http.auth.permission.auth.policy=permit

quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit

quarkus.http.auth.permission.public.paths=/public/*
quarkus.http.auth.permission.public.policy=permit

quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
